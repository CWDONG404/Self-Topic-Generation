[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-document-quiz-backend"
version = "0.1.0"
description = "单用户、自托管的 AI 文档出题与练习平台后端"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2.9,<4",
  "pgvector>=0.4.1,<1",
  "python-multipart>=0.0.20,<1",
  "aiofiles>=24.1,<25",
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "celery[redis]>=5.5,<6",
  "redis>=6.2,<7",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langchain-openai>=0.3,<2",
  "langchain-ollama>=0.3,<2",
  "PyMuPDF>=1.26,<2",
  "python-docx>=1.2,<2",
  "charset-normalizer>=3.4,<4",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
documents = [
  "docling>=2.43,<3",
]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_unused_ignores = true
